name: VoicerAI release

# Builds the Windows and macOS installers for VoicerAI by ThinkFlyFlow and
# attaches them to a GitHub Release on this repository.
#
# Deliberately NOT a fork of the upstream VoiceStudio release pipeline: that one
# gates on signing credentials (Windows Authenticode certificate and an Apple
# Developer ID + notarization), which this project does not have yet. Unsigned
# installers are built here until those certificates are available; users on
# macOS may need to allow the app in System Settings > Privacy & Security.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.0.0)'
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: voicerai-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Local-first: no analytics or update feed from upstream VoiceStudio.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  VITE_POSTHOG_KEY: ''

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            flags: --win --x64
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            flags: --mac --arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            flags: --mac --x64
    defaults:
      run:
        shell: bash
    env:
      VOICERAI_TARGET: ${{ matrix.target }}
      VOICERAI_UPDATE_CHANNEL: electron-stable-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop-bridge -> target
          key: voicerai-${{ matrix.target }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: false

      - name: Bundle pinned uv for the host architecture
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, copyFileSync, chmodSync } from 'node:fs';
          import { join } from 'node:path';
          const expected = process.env.VOICERAI_TARGET;
          const targets = { 'win32-x64': 'x86_64-pc-windows-msvc', 'darwin-arm64': 'aarch64-apple-darwin', 'darwin-x64': 'x86_64-apple-darwin' };
          if (targets[`${process.platform}-${process.arch}`] !== expected) throw new Error('Runner architecture does not match package target');
          const source = execFileSync(process.platform === 'win32' ? 'where.exe' : 'which', ['uv'], { encoding: 'utf8' }).trim().split(/\r?\n/)[0];
          const dir = 'electron/build/uv';
          mkdirSync(dir, { recursive: true });
          const destination = join(dir, `uv-${expected}${process.platform === 'win32' ? '.exe' : ''}`);
          copyFileSync(source, destination);
          if (process.platform !== 'win32') chmodSync(destination, 0o755);
          NODE

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the desktop app
        run: bun run --cwd electron build

      - name: Package installers
        working-directory: electron
        env:
          # Signing material is read from repository secrets the moment they are
          # added; with none set the build stays unsigned, exactly as before.
          #   Windows: WINDOWS_CSC_LINK (base64 .pfx), WINDOWS_CSC_KEY_PASSWORD,
          #            optional WINDOWS_TSA_URL for a timestamp server.
          #   macOS:   MACOS_CSC_LINK (base64 .p12), MACOS_CSC_KEY_PASSWORD, plus
          #            APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to
          #            notarise. Without those the app is ad-hoc signed instead.
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MACOS_CSC_LINK || matrix.platform == 'win32' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.platform == 'win32' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
          WINDOWS_TSA_URL: ${{ matrix.platform == 'win32' && secrets.WINDOWS_TSA_URL || '' }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          bun x electron-builder --config electron-builder.config.mjs ${{ matrix.flags }} --publish never
          ls -la release

      - name: Report the signature state
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "win32" ]; then
            # Read the Authenticode certificate out of the installer itself.
            cert=$(bun x --bun osslsigncode verify -in electron/release/*.exe 2>/dev/null                     | grep -i "subject:" | head -1 || true)
            if [ -n "$cert" ]; then echo "SIGNED: $cert" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "UNSIGNED: no Authenticode signature (SmartScreen will warn)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          else
            app="$(ls -d electron/release/*/VoicerAI.app 2>/dev/null | head -1 || true)"
            plist="${app:+$app/Contents/Info.plist}"
            if [ -n "$plist" ]; then
              # The scheme has to be in the packaged app, not just in the installer.
              /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist" 2>/dev/null                 | grep -qx voicerai && echo "URL scheme: voicerai present"                 || echo "::error::voicerai URL scheme missing from Info.plist"
            fi
          fi

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist-out
          shopt -s nullglob
          for f in electron/release/VoicerAI-Electron-*.exe \
                   electron/release/VoicerAI-Electron-*.dmg \
                   electron/release/VoicerAI-Electron-*.zip; do
            cp "$f" dist-out/
          done
          ls -la dist-out

      # Upload straight to the tag's release instead of an intermediate
      # artifact: artifact storage is a small shared quota (a few installers
      # exhausted it and every release then died in this step), while release
      # assets have no such limit. The job that publishes later only verifies
      # what landed here.
      - name: Upload the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "VoicerAI $TAG" \
              --notes "VoicerAI by ThinkFlyFlow. Desktop voice cloning for Windows and macOS; the engine runs on your own machine."
          fi
          for file in dist-out/*; do
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done

  release:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build jobs already attached the installers to the tag's release, so
      # this job only adds the checksums. It runs on the release assets and does
      # not fall back to fetching their bytes back into the runner.
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist-out --clobber
          cd dist-out
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          cd ..

      # The site fills its "Download VoicerAI" menu from this tag, using one
      # stable file name per platform, so the page never has to know the
      # version. Re-running a release replaces these files in place.
      - name: Refresh the stable download names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view downloads --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create downloads --repo "$GITHUB_REPOSITORY" \
              --title 'VoicerAI downloads' \
              --notes 'Stable download file names for the VoicerAI product page. Each release updates these files in place.'
          fi
          shopt -s nullglob
          for exe in dist-out/*.exe; do
            cp "$exe" dist-out/VoicerAI-Windows-x64-Setup.exe
          done
          for dmg in dist-out/*.dmg; do
            case "$dmg" in
              *arm64*) cp "$dmg" dist-out/VoicerAI-macOS-AppleSilicon.dmg ;;
              *x64*)   cp "$dmg" dist-out/VoicerAI-macOS-Intel.dmg ;;
            esac
          done
          for file in dist-out/VoicerAI-Windows-x64-Setup.exe \
                      dist-out/VoicerAI-macOS-AppleSilicon.dmg \
                      dist-out/VoicerAI-macOS-Intel.dmg \
                      dist-out/SHA256SUMS.txt; do
            [ -f "$file" ] || continue
            gh release upload downloads "$file" --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null \
              || gh release upload downloads "$file" --repo "$GITHUB_REPOSITORY"
          done
